<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Web Chat</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --user-bubble: #0b57d0;
            --gemini-bubble: #282a2d;
            --border-color: #3c4043;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .gemini-message {
            background-color: var(--gemini-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .system-message {
            background: none;
            color: #aaaeaf;
            align-self: center;
            font-size: 0.9rem;
            font-style: italic;
        }

        .input-bar {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        .input-bar textarea {
            flex: 1;
            background: #2a2b2d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-family: inherit;
        }

        .input-bar textarea:focus {
            outline: 1px solid var(--user-bubble);
        }

        .input-bar button {
            background-color: var(--user-bubble);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .input-bar button:hover {
            background-color: #1b6ef2;
        }
        
        .input-bar button:disabled {
            background-color: #3c4043;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container" id="chatWindow">
        <div class="message system-message">Chat is ready. Type a message below!</div>
    </div>

    <div class="input-bar">
        <textarea id="userInput" placeholder="Type a message... (Press Enter to Send)" rows="1"></textarea>
        <button id="sendBtn">Send</button>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.sh/@google/genai";

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Your API Key is now hardcoded here
        const MY_API_KEY = "AIzaSyDHpagt2bYEnU21At5INtEKI-BqRSZV39o";
        let chatSession = null;

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', `${sender}-message`);
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; 
            return msgDiv;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = ''; 
            sendBtn.disabled = true; 

            const aiBubble = appendMessage("🤖 Gemini is typing...", 'gemini');

            try {
                if (!chatSession) {
                    const ai = new GoogleGenAI({ apiKey: MY_API_KEY });
                    chatSession = ai.chats.create({
                        model: 'gemini-3.6-flash',
                    });
                }

                const responseStream = await chatSession.sendMessageStream({ message: text });
                
                let isFirstChunk = true;
                for await (const chunk of responseStream) {
                    if (isFirstChunk) {
                        aiBubble.textContent = ''; 
                        isFirstChunk = false;
                    }
                    aiBubble.textContent += chunk.text;
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }

            } catch (error) {
                console.error("API Error Details:", error);
                aiBubble.textContent = `⚠️ Connection Error: ${error.message}`;
                aiBubble.style.color = '#ff6b6b';
                chatSession = null; 
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
